services:

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: eventrent
      POSTGRES_USER: ${DB_USER:-eventrent}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "eventrent", "-U", "${DB_USER:-eventrent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  php:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      DATABASE_URL: postgresql://${DB_USER:-eventrent}:${DB_PASSWORD}@database:5432/eventrent?serverVersion=16&charset=utf8
      MESSENGER_TRANSPORT_DSN: doctrine://default
      MAILER_DSN: ${MAILER_DSN:?MAILER_DSN is required}
      MERCURE_URL: ${MERCURE_URL:-}
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-}
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:-}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
    volumes:
      - app_var:/var/www/html/var
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      - php

  messenger-worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "-vv"]
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${DB_USER:-eventrent}:${DB_PASSWORD}@database:5432/eventrent?serverVersion=16&charset=utf8
      MESSENGER_TRANSPORT_DSN: doctrine://default
      MAILER_DSN: ${MAILER_DSN}
    volumes:
      - app_var:/var/www/html/var
    depends_on:
      database:
        condition: service_healthy

volumes:
  database_data:
  app_var:
