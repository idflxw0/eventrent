name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eventrent_test
          POSTGRES_USER: eventrent
          POSTGRES_PASSWORD: eventrent
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, intl, zip
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Lint
        run: php bin/console lint:twig templates/ && php bin/console lint:yaml config/ && php bin/console lint:container

      - name: PHPStan
        run: |
          composer require --dev phpstan/phpstan --no-interaction
          vendor/bin/phpstan analyse src/ --level=5

      - name: Create test database
        run: php bin/console doctrine:database:create --env=test --if-not-exists
        env:
          DATABASE_URL: postgresql://eventrent:eventrent@localhost:5432/eventrent_test?serverVersion=16&charset=utf8

      - name: Run migrations
        run: php bin/console doctrine:migrations:migrate --env=test --no-interaction
        env:
          DATABASE_URL: postgresql://eventrent:eventrent@localhost:5432/eventrent_test?serverVersion=16&charset=utf8

      - name: Load fixtures
        run: php bin/console doctrine:fixtures:load --env=test --no-interaction
        env:
          DATABASE_URL: postgresql://eventrent:eventrent@localhost:5432/eventrent_test?serverVersion=16&charset=utf8

      - name: Run tests
        run: vendor/bin/phpunit
        env:
          DATABASE_URL: postgresql://eventrent:eventrent@localhost:5432/eventrent_test?serverVersion=16&charset=utf8
