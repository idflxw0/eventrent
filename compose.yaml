services:
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: eventrent
      POSTGRES_PASSWORD: eventrent
      POSTGRES_USER: eventrent
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "eventrent", "-U", "eventrent"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
    ports:
      - "5439:5432"

  adminer:
    image: adminer:latest
    ports:
      - "8088:8080"
    environment:
      ADMINER_DEFAULT_SERVER: database
    depends_on:
      - database

  php:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/var/www/html:rw
      - vendor:/var/www/html/vendor
      - var:/var/www/html/var
    environment:
      DATABASE_URL: postgresql://eventrent:eventrent@database:5432/eventrent?serverVersion=16&charset=utf8
      MESSENGER_TRANSPORT_DSN: doctrine://default
      MAILER_DSN: smtp://mailer:1025
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: http://localhost:3000/.well-known/mercure
      MERCURE_JWT_SECRET: "!ChangeThisMercureHubJWTSecretKey!"
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
    depends_on:
      database:
        condition: service_healthy
      mailer:
        condition: service_started
      mercure:
        condition: service_started
    ports:
      - "8089:8000"
    entrypoint: ["sh", "/var/www/html/docker/entrypoint.sh"]

  messenger-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/var/www/html:rw
      - vendor:/var/www/html/vendor
      - var:/var/www/html/var
    environment:
      DATABASE_URL: postgresql://eventrent:eventrent@database:5432/eventrent?serverVersion=16&charset=utf8
      MESSENGER_TRANSPORT_DSN: doctrine://default
      MAILER_DSN: smtp://mailer:1025
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: http://localhost:3000/.well-known/mercure
      MERCURE_JWT_SECRET: "!ChangeThisMercureHubJWTSecretKey!"
    depends_on:
      database:
        condition: service_healthy
    command: >
      sh -c "php bin/console messenger:consume async -vv --time-limit=3600"

  mercure:
    image: dunglas/mercure
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: "!ChangeThisMercureHubJWTSecretKey!"
      MERCURE_SUBSCRIBER_JWT_KEY: "!ChangeThisMercureHubJWTSecretKey!"
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://localhost:8089
    ports:
      - "3000:80"

  mailer:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

